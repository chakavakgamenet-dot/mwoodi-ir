services:
  - type: web
    name: mwoodi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./app/backend/Dockerfile
    dockerContext: ./app/backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: mwoodi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: mwoodi-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MWOODI_ADMIN_PASSWORD
        sync: false

  - type: web
    name: mwoodi-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: app/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_ORIGIN
        fromService:
          name: mwoodi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_ORIGIN
        fromService:
          name: mwoodi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: mwoodi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_ENV
        value: production

databases:
  - name: mwoodi-db
    plan: free
    region: frankfurt
